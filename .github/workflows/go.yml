name: Go
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.3"

      - name: goreleaser
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          install-only: true
          version: "2.20.0"

      - name: test
        run: GORELEASER_CMD=$(which goreleaser) make clean all
